name: Build and test
description: Build the helper library and the test suite, then run the tests that need no special hardware
inputs:
  artifact-name:
    description: Unique evidence artifact name for this Ubuntu/compiler job
    required: true
runs:
  using: composite
  steps:
    - name: Configure
      shell: bash
      run: |
        echo "BUILD=$RUNNER_TEMP/avxemu-linux" >> "$GITHUB_ENV"
        cmake -S . -B "$RUNNER_TEMP/avxemu-linux"

    - name: Build
      shell: bash
      run: cmake --build "$BUILD" -j2

    - name: Helper library is AVX1-only and libc-free
      shell: bash
      run: |
        sh test/check-helpers-lib.sh --selftest
        sh test/check-helpers-lib.sh "$BUILD/libavxemu_helpers.a"

    - name: Hermetic and replay registry
      shell: bash
      run: ctest --test-dir "$BUILD" --no-tests=error --output-on-failure -L 'hermetic|replay'

    - name: Every semantic case against the recorded references
      shell: bash
      run: ctest --test-dir "$BUILD" --no-tests=error --output-on-failure -L semantics-full -E live

    - name: Hardware oracles (raw feature guards report skips)
      shell: bash
      run: |
        "$BUILD/test/cpuprobe"
        ctest --test-dir "$BUILD" --no-tests=error --output-on-failure -L hardware

    - name: The build must not have written into the source tree
      if: always()
      shell: bash
      run: test -z "$(git status --porcelain --untracked-files=all)"

    - name: Preserve test evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ env.BUILD }}/Testing/Temporary/
        if-no-files-found: warn
