name: record-references

# spec: DEVELOPING.md "Correctness suite" -- records semantics.ref on AVX2 silicon and runs the
#       full emulator-vs-CPU comparison; both are uploaded, nothing is committed from here.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/spec/**'
      - 'test/known-failures.txt'
      - 'src/**'
      - '.github/workflows/record-references.yml'

permissions:
  contents: read

jobs:
  silicon:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require the instruction sets under test
        run: |
          grep -m1 'model name' /proc/cpuinfo
          for f in avx2 bmi1 bmi2 fma f16c movbe abm; do
            grep -qw "$f" /proc/cpuinfo || { echo "this runner lacks $f; references must come from AVX2 silicon"; exit 1; }
          done
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Build
        run: |
          cmake -S . -B "$RUNNER_TEMP/b" -DMavericksShipyard_DIR="$MavericksShipyard_DIR"
          cmake --build "$RUNNER_TEMP/b" -j4 --target semtest
      - name: Emulator against this CPU, every case
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          AVXEMU_DISABLE=1 KNOWN_VERBOSE=1 "$RUNNER_TEMP/b/test/semtest" live full 2>&1 | tee "$RUNNER_TEMP/out/live.log"
          exit "${PIPESTATUS[0]}"
      - name: Record the reference
        continue-on-error: true
        run: |
          AVXEMU_DISABLE=1 KNOWN_VERBOSE=1 "$RUNNER_TEMP/b/test/semtest" record "$RUNNER_TEMP/out/semantics.ref" 2>&1 | tee "$RUNNER_TEMP/out/record.log"
          exit "${PIPESTATUS[0]}"
      - name: Record app output hashes (native, AVX2)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq zstd sqlite3 openssl python3-numpy python3-venv
          python3 -m venv --system-site-packages "$RUNNER_TEMP/dv"
          "$RUNNER_TEMP/dv/bin/pip" install -q duckdb==2.0.0
          PATH="$RUNNER_TEMP/dv/bin:$PATH" python3 test/apps/run_apps.py --record "$RUNNER_TEMP/out/expected.tsv" 2>&1 | tee "$RUNNER_TEMP/out/apps.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semantics-reference
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
